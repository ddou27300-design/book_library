<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - GROUP2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="/css/main.css" rel="stylesheet"/>
    <style>
        .auth-body { min-height: 100vh; overflow-y: auto; }
    </style>
</head>
<body class="auth-body">

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo mb-4 d-flex flex-column align-items-center text-center">
            <img th:src="@{/images/Logo.png}" alt="Logo" style="width: 100px; height: auto; max-height: 100px; object-fit: contain; margin-bottom: 1.5rem;" />
            <h1 class="auth-title text-white fw-bold mb-1" style="font-family: var(--font-display); font-size: 2.2rem; letter-spacing: -0.02em;">GROUP2</h1>
            <p class="auth-subtitle text-muted small">Sign in to your account to continue</p>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-2"></i>
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            <i class="bi bi-check-circle me-2"></i>You have been logged out.
        </div>

        <form th:action="@{/login}" method="post">

            <div class="form-group mb-3">
                <label class="form-label fw-medium">Email Address</label>
                <div class="input-icon-group">
                    <i class="bi bi-envelope input-icon"></i>
                    <input type="email" name="email" class="form-control form-control-lg input-with-icon"
                           placeholder="you@example.com" required/>
                </div>
            </div>

            <div class="form-group mb-4">
                <div class="d-flex justify-content-between">
                    <label class="form-label fw-medium">Password</label>
                </div>
                <div class="input-icon-group">
                    <i class="bi bi-lock input-icon"></i>
                    <input type="password" name="password" id="password"
                           class="form-control form-control-lg input-with-icon"
                           placeholder="Enter your password" required/>
                    <button type="button" class="btn-toggle-password" onclick="togglePassword()">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe"/>
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
            </div>

            <button type="submit" class="btn btn-auth-primary w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <div class="text-center">
            <p class="mb-0">Don't have an account?
                <a href="/register" class="auth-link fw-semibold">Create one free</a>
            </p>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePassword() {
    const pwd = document.getElementById('password');
    const icon = document.getElementById('toggleIcon');
    if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        pwd.type = 'password';
        icon.className = 'bi bi-eye';
    }
}
</script>
</body>
</html>
