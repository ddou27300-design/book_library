<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::main}, 'Downloads', ~{}, ~{})}">
<head><title>Downloads - GROUP2</title></head>
<body>
<main>
<div class="page-header-section">
    <div class="container">
        <h1 class="page-title">Download History</h1>
        <p class="page-subtitle">Your recently downloaded books</p>
    </div>
</div>

<div class="container py-5">
    <div th:if="${!history.empty}" class="card border-0 shadow-sm" style="background:var(--card-bg);border:1px solid var(--card-bdr);">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Book</th>
                            <th>Author</th>
                            <th>Downloaded</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="entry : ${history}">
                            <td th:text="${entry.book.title}">Title</td>
                            <td th:text="${entry.book.author}">Author</td>
                            <td th:text="${#temporals.format(entry.downloadDate, 'MMM dd, yyyy HH:mm')}">Date</td>
                            <td>
                                <a th:href="@{/books/{id}/read(id=${entry.book.id})}" class="btn btn-sm btn-outline-primary">Read</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:if="${history.empty}" class="text-center py-5">
        <i class="bi bi-download display-1 text-muted d-block mb-3"></i>
        <h4 class="text-muted">No downloads yet</h4>
        <p class="text-muted">Start browsing and download some books</p>
        <a href="/books" class="btn btn-primary-custom">Browse Books</a>
    </div>
</div>
</main>
</body>
</html>
