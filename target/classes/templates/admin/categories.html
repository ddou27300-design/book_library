<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin-layout :: layout(~{::main}, 'Categories', ~{}, ~{}, 'categories')}">
<head><title>Categories - GROUP2 Admin</title></head>
<body>
<main>
<div class="p-4">
    <h2 class="mb-4">Categories</h2>

    <!-- Add Category Form -->
    <div class="card border-0 shadow-sm mb-4" style="background:var(--ink-mid);border:1px solid var(--border);">
        <div class="card-header fw-bold" style="background:var(--ink-lift);border-bottom:1px solid var(--border);">Add New Category</div>
        <div class="card-body">
            <form action="/admin/categories" method="post">
                <div class="row g-3 align-items-end">
                    <div class="col-md-5">
                        <label class="form-label fw-medium">Name *</label>
                        <input type="text" name="name" class="form-control" required/>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label fw-medium">Description</label>
                        <input type="text" name="description" class="form-control"/>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary-custom w-100">
                            <i class="bi bi-plus-lg me-1"></i>Add
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Categories Table -->
    <div class="card border-0 shadow-sm" style="background:var(--ink-mid);border:1px solid var(--border);">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cat : ${categories}">
                            <td th:text="${cat.id}">1</td>
                            <td th:text="${cat.name}">Name</td>
                            <td th:text="${cat.description}">Description</td>
                            <td>
                                <form th:action="@{/admin/categories/{id}/delete(id=${cat.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Delete this category?')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${categories.empty}">
                            <td colspan="4" class="text-center text-muted py-4">No categories yet</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</main>
</body>
</html>
