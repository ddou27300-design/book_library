<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin-layout :: layout(~{::main}, 'Messages', ~{}, ~{}, 'messages')}">
<head><title>Messages - GROUP2 Admin</title></head>
<body>
<main>
<div class="p-4">
    <h2 class="mb-4">Messages</h2>

    <!-- Messages Table -->
    <div class="card border-0 shadow-sm" style="background:var(--ink-mid);border:1px solid var(--border);">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Subject</th>
                            <th>Message</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="msg : ${messages}">
                            <td th:text="${msg.id}">1</td>
                            <td th:text="${msg.fullName}">Name</td>
                            <td th:text="${msg.email}">Email</td>
                            <td th:text="${msg.subject}">Subject</td>
                            <td th:text="${msg.message}" style="max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Message</td>
                            <td th:text="${#temporals.format(msg.createdAt, 'yyyy-MM-dd HH:mm')}">Date</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(messages)}">
                            <td colspan="6" class="text-center text-muted py-4">No messages found</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</main>
</body>
</html>
