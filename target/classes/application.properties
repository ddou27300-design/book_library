# =========================================================
# APPLICATION CONFIGURATION
# =========================================================
spring.application.name=Online Book Library
server.port=8080

# =========================================================
# DATABASE CONFIGURATION (Local XAMPP MySQL)
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/book_library?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE CONFIGURATION
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================================================
# THYMELEAF CONFIGURATION
# =========================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# =========================================================
# FILE UPLOAD CONFIGURATION
# =========================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# =========================================================
# LOCAL FILE STORAGE
# =========================================================
app.upload.dir=uploads

# =========================================================
# LOGGING CONFIGURATION
# =========================================================
logging.level.com.library=DEBUG
logging.level.org.springframework.security=INFO