<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<th:block th:fragment="layout(content, pageTitle, extraScripts, extraHead, activePage)">
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle} + ' - GROUP2 Admin'">Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="/css/main.css" rel="stylesheet"/>
    <link href="/css/admin.css" rel="stylesheet"/>
    <th:block th:replace="${extraHead}"></th:block>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #12141c;
            color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }
        .admin-wrapper {
            display: flex;
            min-height: 100vh;
            width: 100vw;
        }
        .admin-sidebar {
            width: 260px;
            background-color: #1a1d29;
            border-right: 1px solid #2a2e3f;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
        }
        .admin-main-stage {
            flex-grow: 1;
            margin-left: 260px;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background-color: #12141c;
        }
        .admin-topbar {
            height: 70px;
            background-color: #1a1d29;
            border-bottom: 1px solid #2a2e3f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }
        .admin-content-view {
            padding: 30px;
            flex-grow: 1;
            overflow-y: auto;
        }
    </style>
</head>
<body class="admin-body">

<div class="admin-wrapper">

    <aside class="admin-sidebar" id="adminSidebar">
        <div class="sidebar-header" style="padding: 1.25rem 1rem; border-bottom: 1px solid #2a2e3f;">
            <a href="/" class="sidebar-brand" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #f8f9fa; font-weight: 700; font-size: 1.3rem;">
                <img th:src="@{/images/Logo.png}" src="/images/Logo.png" alt="GROUP2 Logo" style="width: 28px; height: 28px; object-fit: contain;" /><span>GROUP2</span>
            </a>
        </div>
        <div class="sidebar-nav" style="padding: 1rem 0; flex-grow: 1; overflow-y: auto;">
            <div style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: #5a6380; font-weight: 700; padding: 0.5rem 1rem; margin-bottom: 0.25rem;">Main</div>
            <nav style="display: flex; flex-direction: column; gap: 2px; padding: 0 0.5rem;">
                <a href="/admin/dashboard" th:class="'sidebar-item' + (${activePage} == 'dashboard' ? ' active' : '')" style="display: flex; align-items: center; gap: 12px; padding: 0.75rem 1rem; color: #8892a8; text-decoration: none; border-radius: 8px; font-size: 0.9rem; font-weight: 500; transition: all 0.2s;">
                    <i class="bi bi-speedometer2" style="color: #e8a030; width: 20px; text-align: center;"></i><span>Dashboard</span>
                </a>
                <a href="/admin/books" th:class="'sidebar-item' + (${activePage} == 'books' ? ' active' : '')" style="display: flex; align-items: center; gap: 12px; padding: 0.75rem 1rem; color: #8892a8; text-decoration: none; border-radius: 8px; font-size: 0.9rem; font-weight: 500; transition: all 0.2s;">
                    <i class="bi bi-book" style="color: #e8a030; width: 20px; text-align: center;"></i><span>Books</span>
                </a>
                <a href="/admin/categories" th:class="'sidebar-item' + (${activePage} == 'categories' ? ' active' : '')" style="display: flex; align-items: center; gap: 12px; padding: 0.75rem 1rem; color: #8892a8; text-decoration: none; border-radius: 8px; font-size: 0.9rem; font-weight: 500; transition: all 0.2s;">
                    <i class="bi bi-tags" style="color: #e8a030; width: 20px; text-align: center;"></i><span>Categories</span>
                </a>
                <a href="/admin/users" th:class="'sidebar-item' + (${activePage} == 'users' ? ' active' : '')" style="display: flex; align-items: center; gap: 12px; padding: 0.75rem 1rem; color: #8892a8; text-decoration: none; border-radius: 8px; font-size: 0.9rem; font-weight: 500; transition: all 0.2s;">
                    <i class="bi bi-people" style="color: #e8a030; width: 20px; text-align: center;"></i><span>Users</span>
                </a>
                <a href="/admin/statistics" th:class="'sidebar-item' + (${activePage} == 'statistics' ? ' active' : '')" style="display: flex; align-items: center; gap: 12px; padding: 0.75rem 1rem; color: #8892a8; text-decoration: none; border-radius: 8px; font-size: 0.9rem; font-weight: 500; transition: all 0.2s;">
                    <i class="bi bi-bar-chart" style="color: #e8a030; width: 20px; text-align: center;"></i><span>Statistics</span>
                </a>
            </nav>
            <div style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: #5a6380; font-weight: 700; padding: 0.5rem 1rem; margin-top: 1rem; margin-bottom: 0.25rem;">Account</div>
            <nav style="display: flex; flex-direction: column; gap: 2px; padding: 0 0.5rem;">
                <a href="/user/profile" class="sidebar-item" style="display: flex; align-items: center; gap: 12px; padding: 0.75rem 1rem; color: #8892a8; text-decoration: none; border-radius: 8px; font-size: 0.9rem; font-weight: 500; transition: all 0.2s;">
                    <i class="bi bi-person" style="color: #e8a030; width: 20px; text-align: center;"></i><span>Profile</span>
                </a>
                <a href="/" class="sidebar-item" style="display: flex; align-items: center; gap: 12px; padding: 0.75rem 1rem; color: #8892a8; text-decoration: none; border-radius: 8px; font-size: 0.9rem; font-weight: 500; transition: all 0.2s;">
                    <i class="bi bi-house" style="color: #e8a030; width: 20px; text-align: center;"></i><span>View Site</span>
                </a>
                <form th:action="@{/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="sidebar-item sidebar-logout w-100" style="display: flex; align-items: center; gap: 12px; padding: 0.75rem 1rem; color: #8892a8; text-decoration: none; border-radius: 8px; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; background: none; border: none; cursor: pointer; text-align: left;">
                        <i class="bi bi-box-arrow-right" style="color: #e8a030; width: 20px; text-align: center;"></i><span>Logout</span>
                    </button>
                </form>
            </nav>
        </div>
    </aside>

    <div class="admin-main-stage">

        <header class="admin-topbar">
            <div class="d-flex align-items-center">
                <span class="fs-5 fw-semibold text-warning" th:text="${pageTitle}">Admin</span>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white-50 small"><i class="bi bi-person-circle me-1"></i> admin@library.com</span>
                <a th:href="@{/logout}" class="btn btn-sm btn-outline-danger px-3"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
            </div>
        </header>

        <main class="admin-content-view">
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <th:block th:replace="${content}"></th:block>
        </main>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/js/admin.js"></script>
<th:block th:replace="${extraScripts}"></th:block>
</body>
</html>
</th:block>

</body>
</html>
