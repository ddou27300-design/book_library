<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::main}, 'My Profile', ~{}, ~{::script})}">
<head>
    <title>My Profile - GROUP2</title>
</head>
<body>

<main>
<div class="page-header-section">
    <div class="container">
        <h1 class="page-title">My Profile</h1>
        <p class="page-subtitle">Manage your account settings</p>
    </div>
</div>

<div class="container py-5" style="margin-top: 40px; animation: fadeIn 0.45s cubic-bezier(0.4, 0, 0.2, 1) both;">
    <div th:if="${success}" class="alert alert-success mb-4" role="alert" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger mb-4" role="alert" th:text="${error}"></div>

    <form th:action="@{/user/profile/update}" method="post" enctype="multipart/form-data" th:object="${profileDto}">
        <div class="row g-4">

            <div class="col-lg-4 col-md-5">
                <div class="card p-4 text-center h-100" style="background: var(--card-bg); border: 1px solid var(--card-bdr); border-radius: var(--radius-lg); box-shadow: var(--shadow-md);">

                    <div class="profile-avatar-wrapper mb-3" style="position: relative; display: inline-block; margin: 0 auto;">
                        <label for="avatarFileInput" style="cursor: pointer; display: block; position: relative;">
                            <img id="avatarPreview"
                                 th:src="${user.profileImage != null and !user.profileImage.isEmpty()} ? @{/{img}(img=${user.profileImage})} : @{/images/default-avatar.png}"
                                 src="/images/default-avatar.png"
                                 class="rounded-circle"
                                 style="width: 130px; height: 130px; object-fit: cover; border: 3px solid var(--amber); background: var(--ink-mid); transition: var(--transition);"
                                 alt="Avatar Preview"/>
                            <div style="position: absolute; bottom: 6px; right: 6px; background: var(--amber); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm);">
                                <span style="color: var(--ink); font-weight: 700; font-size: 16px;">+</span>
                            </div>
                        </label>
                        <input type="file" id="avatarFileInput" name="profileImage" accept="image/*" style="display: none;" onchange="previewProfileImage(event)" />
                    </div>

                    <p style="color: var(--text-dim); font-size: 0.8rem; margin-bottom: 1.5rem;">Click photo to change</p>

                    <h3 class="fw-bold text-uppercase mb-1" style="font-family: var(--font-display); color: var(--text-head); font-size: 1.4rem;" th:text="${user.fullName}">User Name</h3>
                    <p style="color: var(--text-dim); font-size: 0.85rem; margin-bottom: 1.5rem;" th:text="${user.email}">user@email.com</p>

                    <div class="mt-2">
                        <span class="badge text-uppercase px-3 py-2" style="background: rgba(232,160,48,0.1); border: 1px solid rgba(232,160,48,0.25); color: var(--amber); font-weight: 600; font-size: 0.75rem; border-radius: 100px; letter-spacing: 0.05em;" th:text="${user.role}">Role</span>
                    </div>

                    <div class="mt-3 text-start" style="color: var(--text-dim); font-size: 0.85rem;">
                        <p class="mb-1" th:if="${user.phone != null and !user.phone.isEmpty()}"><i class="bi bi-phone me-2" style="color: var(--amber);"></i><span th:text="${user.phone}"></span></p>
                        <p class="mb-0" th:if="${user.bio != null and !user.bio.isEmpty()}"><i class="bi bi-info-circle me-2" style="color: var(--amber);"></i><span th:text="${user.bio}"></span></p>
                    </div>
                </div>
            </div>

            <div class="col-lg-8 col-md-7">
                <div class="card p-4 h-100" style="background: var(--card-bg); border: 1px solid var(--card-bdr); border-radius: var(--radius-lg); box-shadow: var(--shadow-md);">
                    <h2 class="mb-4" style="font-family: var(--font-display); color: var(--text-head); font-size: 1.6rem; border-bottom: 1px solid var(--border); padding-bottom: 12px;">Account Profile Settings</h2>

                    <div class="mb-3 form-group">
                        <label class="form-label" style="color: var(--text-dim); font-size: 0.85rem;">Full Name</label>
                        <input type="text" class="form-control" th:field="*{fullName}" style="padding: 0.65rem 1rem; background: var(--ink-mid); border: 1px solid var(--border); color: var(--text-head);" placeholder="Enter full name"/>
                    </div>

                    <div class="mb-3 form-group">
                        <label class="form-label" style="color: var(--text-dim); font-size: 0.85rem;">Phone Number</label>
                        <input type="text" class="form-control" th:field="*{phone}" style="padding: 0.65rem 1rem; background: var(--ink-mid); border: 1px solid var(--border); color: var(--text-head);" placeholder="Enter phone number"/>
                    </div>

                    <div class="mb-4 form-group">
                        <label class="form-label" style="color: var(--text-dim); font-size: 0.85rem;">Biography Description</label>
                        <textarea class="form-control" th:field="*{bio}" rows="4" style="padding: 0.65rem 1rem; background: var(--ink-mid); border: 1px solid var(--border); color: var(--text-head); resize: none;" placeholder="Tell us about yourself..."></textarea>
                    </div>

                    <hr style="border-color: var(--border);"/>
                    <h5 class="mb-3" style="font-family: var(--font-display); color: var(--text-head); font-size: 1.1rem;">Change Password</h5>

                    <div class="mb-3 form-group">
                        <label class="form-label" style="color: var(--text-dim); font-size: 0.85rem;">Current Password</label>
                        <input type="password" class="form-control" th:field="*{currentPassword}" style="padding: 0.65rem 1rem; background: var(--ink-mid); border: 1px solid var(--border); color: var(--text-head);" placeholder="Enter current password"/>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label" style="color: var(--text-dim); font-size: 0.85rem;">New Password</label>
                            <input type="password" class="form-control" th:field="*{newPassword}" style="padding: 0.65rem 1rem; background: var(--ink-mid); border: 1px solid var(--border); color: var(--text-head);" placeholder="Enter new password"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" style="color: var(--text-dim); font-size: 0.85rem;">Confirm New Password</label>
                            <input type="password" class="form-control" th:field="*{confirmNewPassword}" style="padding: 0.65rem 1rem; background: var(--ink-mid); border: 1px solid var(--border); color: var(--text-head);" placeholder="Confirm new password"/>
                        </div>
                    </div>

                    <div class="mt-2 pt-2 border-top" style="border-color: var(--border) !important;">
                        <button type="submit" class="btn btn-primary-custom px-4 py-2">
                            <i class="bi bi-check2-circle me-2"></i> Update Profile
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </form>
</div>
</main>

<script th:inline="javascript">
function previewProfileImage(event) {
    const fileInput = event.target;
    if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const previewImage = document.getElementById('avatarPreview');
            if (previewImage) {
                previewImage.src = e.target.result;
            }
        };
        reader.readAsDataURL(fileInput.files[0]);
    }
}
</script>

</body>
</html>
