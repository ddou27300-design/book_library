<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin-layout :: layout(~{::main}, 'Books', ~{}, ~{}, 'books')}">
<head><title>Books - GROUP2 Admin</title></head>
<body>
<main>
<div class="p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Books</h2>
        <a href="/admin/books/add" class="btn btn-primary-custom">
            <i class="bi bi-plus-lg me-1"></i>Add Book
        </a>
    </div>

    <!-- Search -->
    <form action="/admin/books" method="get" class="mb-4">
        <div class="input-group" style="max-width:400px;">
            <input type="text" name="keyword" class="form-control" th:value="${keyword}" placeholder="Search books..."/>
            <button class="btn btn-primary-custom" type="submit"><i class="bi bi-search"></i></button>
        </div>
    </form>

    <!-- Books Table -->
    <div class="card border-0 shadow-sm" style="background:var(--ink-mid);border:1px solid var(--border);">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Category</th>
                            <th>Downloads</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="book : ${books}">
                            <td th:text="${book.id}">1</td>
                            <td th:text="${book.title}">Title</td>
                            <td th:text="${book.author}">Author</td>
                            <td th:text="${book.category?.name}">Category</td>
                            <td th:text="${book.totalDownloads}">0</td>
                            <td>
                                <div class="d-flex gap-1">
                                    <a th:href="@{/admin/books/{id}/edit(id=${book.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                                    <form th:action="@{/admin/books/{id}/delete(id=${book.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('Are you sure?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${books.empty}">
                            <td colspan="6" class="text-center text-muted py-4">No books found</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/books(page=${currentPage - 1}, keyword=${keyword})}"><i class="bi bi-chevron-left"></i></a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:text="${i + 1}" th:href="@{/admin/books(page=${i}, keyword=${keyword})}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/books(page=${currentPage + 1}, keyword=${keyword})}"><i class="bi bi-chevron-right"></i></a>
            </li>
        </ul>
    </nav>
</div>
</main>
</body>
</html>
